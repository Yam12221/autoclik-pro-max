name: Build & Release Reubicador de Botones Pro

on:
  push:
    branches: [ "main", "reubicador-pro" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Fix Line Endings and Permissions for gradlew
      run: |
        sed -i -e 's/\r$//' gradlew
        chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleDebug --stacktrace --info > gradle_build.log 2>&1

    - name: Upload Logs on Failure
      if: failure() || cancelled()
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git checkout --orphan build-log || git checkout build-log
        git rm -rf . || true
        cp -f gradle_build.log index.html || cp -f gradle_build.log error.log
        git add .
        git commit -m "Upload build failure log"
        git push origin build-log --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Reubicador-De-Botones-Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-reubicador
        name: "Reubicador de Botones Pro v1.0.0 (APK)"
        body: |
          ### Reubicador de Botones Táctiles Pro (APK para Android)
          - **Botón Gatillo Flotante Falso (`T1`, `T2`, ...)**: Se coloca donde te sea cómodo tocar.
          - **Puntero Objetivo Real (`R1`, `R2`, ...)**: Se coloca sobre el botón del juego.
          - **Protección Anti-Baneo (`AntiDetectEngine`)**: Jitter posicional estocástico (±4px) y duración humana de pulsación (18ms-45ms) para evadir detectores anti-cheat.
          - **App independiente dedicada**.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
