name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Reubicador-De-Botones-Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0
        name: "Reubicador de Botones Pro v1.0.0"
        body: |
          ### Reubicador de Botones Táctiles para Pantalla (Android APK)
          - **Botón Gatillo Flotante Falso (`T1`, `T2`, ...)**: Ubicable donde sea más cómodo tocar.
          - **Puntero Objetivo Real (`R1`, `R2`, ...)**: Ubicable sobre el botón real del juego.
          - **Protección Anti-Baneo (`AntiDetectEngine`)**: Micro-jitter estocástico de píxel (±4px) y duración humana de pulsación (18ms-45ms) para evitar detección por anti-cheats.
          - **Perfiles de Layout y Selección de Niveles de Seguridad**.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
